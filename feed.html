<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landmark Vibes - Feed</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f0f2f5;padding-bottom:70px}
  header{background:#0a7a42;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  header h1{font-size:19px}
  header a{color:white;text-decoration:none;background:#00000033;padding:7px 12px;border-radius:20px;font-size:13px}
  .container{max-width:600px;margin:15px auto;padding:0 10px}
  .welcome{background:white;padding:12px 15px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px #00000020}
  .create{background:white;padding:15px;border-radius:12px;box-shadow:0 1px 3px #00000020}
  .create textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;resize:none;outline:none}
  .create button{background:#0a7a42;color:white;border:none;padding:10px 18px;border-radius:20px;margin-top:10px;cursor:pointer;font-weight:bold}
  .tabs{display:flex;gap:10px;margin:15px 0}
  .tabs button{flex:1;padding:10px;border:none;border-radius:20px;background:white;cursor:pointer;font-weight:bold}
  .tabs button.active{background:#0a7a42;color:white}
  .post{background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 1px 3px #00000020}
  .post-head{display:flex;gap:10px;align-items:center}
  .avatar{width:40px;height:40px;border-radius:50%;background:#0a7a42;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
  .post-head small{color:#666}
  .post p{margin:10px 0;line-height:1.5}
  .post img,.post video{width:100%;border-radius:10px;margin-top:10px}
  .actions{display:flex;justify-content:space-between;border-top:1px solid #eee;padding-top:10px;margin-top:10px}
  .actions button{border:none;background:none;cursor:pointer;font-weight:bold;color:#444}
  .actions button.liked{color:#e0245e}
  .comments{margin-top:10px;display:none}
  .comments input{width:100%;padding:8px;border:1px solid #ddd;border-radius:20px;outline:none}
  .comment{font-size:14px;margin-top:8px;background:#f0f2f5;padding:8px 10px;border-radius:10px}
  nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:13px;border-top:1px solid #ddd}
  nav a{text-decoration:none;color:#333;font-weight:bold;font-size:14px}
  nav a.active{color:#0a7a42}
</style>
</head>
<body>

<header>
  <h1>🌴 Landmark Vibes</h1>
  <a href="chat.html">💬 Chat</a>
</header>

<div class="container">
  <div class="welcome">Welcome <b id="userName">Landmark Student</b> 👋 <span id="userMatric" style="color:#0a7a42"></span></div>

  <div class="create">
    <textarea id="postText" rows="3" placeholder="Wetin dey happen for Landmark? Post gist..."></textarea>
    <input type="file" id="postFile" accept="image/*,video/*" style="margin-top:8px">
    <br><button onclick="addPost()">Post Gist 🚀</button>
  </div>

  <div class="tabs">
    <button id="tabAll" class="active" onclick="showTab('all')">All Gist</button>
    <button id="tabVideo" onclick="showTab('video')">🎬 Short Videos</button>
    <button id="tabMarket" onclick="showTab('market')">🛒 Market</button>
  </div>

  <div id="feed"></div>
</div>

<nav>
  <a href="feed.html" class="active">🏠 Feed</a>
  <a href="chat.html">💬 Chat</a>
  <a href="market.html">🛒 Market</a>
  <a href="index.html">👤 Logout</a>
</nav>

<script>
let myName = localStorage.getItem('name') || "Landmark Student";
let myMatric = localStorage.getItem('matric') || "";
document.getElementById('userName').innerText = myName;
document.getElementById('userMatric').innerText = myMatric ? "("+myMatric+")" : "";

let posts = [
  {id:1, name:"Tobi - 100L CSC", time:"2 mins ago", text:"Who get GST 101 handout? I go buy am now now for Hostel C 😭", type:"all", img:"", likes:12, comments:["I get am, DM me"]},
  {id:2, name:"Ada - 200L BCH", time:"1 hr ago", text:"Short video: How I pass Chemistry in one sitting 🔥 Watch am!", type:"video", img:"", video:"https://www.w3schools.com/html/mov_bbb.mp4", likes:45, comments:["This help me wella!"]},
  {id:3, name:"Verified Vendor - Chisom Wigs ✅", time:"3 hrs ago", text:"Human hair wig 26 inches - ₦45k only! DM for Market.", type:"market", img:"https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?w=600", likes:30, comments:[]},
];

function render(filter='all'){
  let feed = document.getElementById('feed');
  feed.innerHTML = '';
  posts.filter(p => filter==='all' || p.type===filter).forEach(p=>{
    let media = '';
    if(p.img) media = `<img src="${p.img}">`;
    if(p.video) media = `<video src="${p.video}" controls></video>`;
    feed.innerHTML += `
    <div class="post">
      <div class="post-head"><div class="avatar">${p.name[0]}</div><div><b>${p.name}</b><br><small>${p.time}</small></div></div>
      <p>${p.text}</p>${media}
      <div class="actions">
        <button onclick="likePost(${p.id},this)">❤️ Like (${p.likes})</button>
        <button onclick="toggleComment(${p.id})">💬 Comment (${p.comments.length})</button>
        <button onclick="sharePost()">🔗 Share</button>
      </div>
      <div class="comments" id="c-${p.id}">
        ${p.comments.map(c=>`<div class="comment">${c}</div>`).join('')}
        <input placeholder="Write comment..." onkeydown="if(event.key==='Enter'){addComment(${p.id},this)}">
      </div>
    </div>`;
  });
}
function showTab(t){
  document.getElementById('tabAll').classList.remove('active');
  document.getElementById('tabVideo').classList.remove('active');
  document.getElementById('tabMarket').classList.remove('active');
  if(t==='all') document.getElementById('tabAll').classList.add('active');
  if(t==='video') document.getElementById('tabVideo').classList.add('active');
  if(t==='market') document.getElementById('tabMarket').classList.add('active');
  render(t);
}
function likePost(id,btn){ let p=posts.find(x=>x.id===id); p.likes++; btn.innerText=`❤️ Like (${p.likes})`; btn.classList.add('liked'); }
function toggleComment(id){ let el=document.getElementById('c-'+id); el.style.display = el.style.display==='block'?'none':'block'; }
function addComment(id,input){ if(!input.value) return; let p=posts.find(x=>x.id===id); p.comments.push("You: "+input.value); input.value=''; render(); }
function sharePost(){ navigator.clipboard.writeText(window.location.href); alert("Link copied! Share am for WhatsApp"); }
function addPost(){
  let text=document.getElementById('postText').value;
  if(!text) return alert("Write something first");
  posts.unshift({id:Date.now(), name:myName, time:"Just now", text:text, type:"all", img:"", likes:0, comments:[]});
  document.getElementById('postText').value='';
  render(); alert("Posted! ✅");
}
render();
</script>
</body>
</html>
